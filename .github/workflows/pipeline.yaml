name: devsecops-pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
     sast:
    name: Code scanning (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config p/default --error
     iac:
    name: IaC scanning (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false

      secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dependencies:
    name: Dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore app/taskflow-api.csproj
      - name: List vulnerable packages
        run: |
          dotnet list app/taskflow-api.csproj package --vulnerable --include-transitive 2>&1 | tee deps.txt
          if grep -q -E "Critical|High" deps.txt; then
            echo "Vulnerable dependencies found"; exit 1
          fi
